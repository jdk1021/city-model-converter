<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Illustration source</title>
<!-- 화면과 README에 쓰는 그림 원본. ?scene=hero|split|classify|georef 로 열어 #art를 투명 배경으로 캡처한다. -->
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; color: #191f28; letter-spacing: -0.02em; }
  .art { position: relative; display: none; overflow: hidden; }
  .art.on { display: block; }
  .blob { position: absolute; border-radius: 50%; }
  .panel { position: absolute; background: #fff; border-radius: 36px; box-shadow: 0 24px 60px rgba(0, 0, 0, .14); padding: 36px; }
  .cap { color: #8b95a1; font-size: 24px; font-weight: 600; }
  .ttl { font-size: 40px; font-weight: 800; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 20px; margin-top: 26px; font-size: 30px; font-weight: 600; }
  .row small { margin-left: auto; color: #8b95a1; font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .badge { flex: none; width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; color: #fff; font-size: 24px; font-weight: 800; }
  .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; }
  .pill { display: inline-block; padding: 8px 20px; border-radius: 999px; background: #e8f3ff; color: #3182f6; font-size: 24px; font-weight: 700; }
  .chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 26px; border-radius: 22px; background: #fff;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .13); font-size: 30px; font-weight: 700; white-space: nowrap; }
  .go { position: absolute; width: 104px; height: 104px; border-radius: 50%; background: #3182f6; display: grid; place-items: center;
    box-shadow: 0 16px 36px rgba(0, 0, 0, .2); }
  svg { display: block; }
</style>
</head>
<body>

<!-- 히어로: 모델 파일이 CityGML 건물이 되는 과정을 카드 두 장으로 -->
<div class="art" id="hero" style="width:1280px;height:820px">

  <div class="blob" style="left:860px;top:30px;width:230px;height:230px;background:#d3e8ff"></div>
  <div class="panel" style="left:40px;top:170px;width:500px;transform:rotate(-4deg)">

    <div class="row"><span class="badge" style="background:#3182f6">OBJ</span>campus.obj<small>48 MB</small></div>
    <div class="row"><span class="badge" style="background:#8b5cf6">3DS</span>tower.3ds<small>12 MB</small></div>
    <div class="row"><span class="badge" style="background:#15c47e">PNG</span>wall.png<small>2 MB</small></div>
  </div>
  <div class="panel" style="left:630px;top:110px;width:540px;transform:rotate(3deg)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="cap">bldg:Building</div><div class="ttl">CityGML 3.0</div></div>
      <span class="pill">LoD2</span>
    </div>
    <svg viewBox="0 0 488 250" width="468" height="240" style="margin-top:24px;border-radius:24px;background:#f2f4f6">
      <rect x="84" y="208" width="320" height="14" rx="7" fill="#5f7184"/>
      <rect x="124" y="118" width="240" height="84" rx="6" fill="#e9dcb8"/>
      <rect x="160" y="146" width="44" height="56" rx="4" fill="#fff" opacity=".85"/>
      <rect x="236" y="140" width="92" height="34" rx="4" fill="#fff" opacity=".85"/>
      <path d="M104 112 L244 34 L384 112 Z" fill="#e5604a" stroke="#e5604a" stroke-width="12" stroke-linejoin="round"/>
    </svg>
    <div class="row"><span class="dot" style="background:#e5604a"></span>RoofSurface<small>2</small></div>
    <div class="row"><span class="dot" style="background:#e0cf9f"></span>WallSurface<small>4</small></div>
    <div class="row"><span class="dot" style="background:#5f7184"></span>GroundSurface<small>1</small></div>
  </div>
  <div class="go" style="left:536px;top:300px">
    <svg viewBox="0 0 48 48" width="52" height="52"><path d="M10 24h26M26 12l12 12-12 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

  <div class="chip" style="left:800px;top:270px;font-variant-numeric:tabular-nums">X 200 158.420</div>
  <div class="chip" style="left:800px;top:370px;font-variant-numeric:tabular-nums">Y 500 073.115</div>

<script>
  const name = new URLSearchParams(location.search).get('scene') || 'hero';
  (document.getElementById(name) || document.getElementById('hero')).classList.add('on');

</script>
</body>
</html>
